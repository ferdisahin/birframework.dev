        <nav class="hidden md:flex items-center gap-6 text-sm text-zinc-400 font-normal">

  <!-- Page Slot -->

  <!-- Clean Footer -->

    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">

        <span>•</span>
        <span>Open-source software licensed under MIT</span>
      </div>

      <div class="flex items-center gap-6">
        <a href="/docs/installation" class="hover:text-zinc-300 transition">Docs</a>

        <a href="/api/health" class="hover:text-zinc-300 transition">API Status</a>
      </div>
    </div>
  </footer>

  <!-- Code Copy Script -->
  <script>
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-copy]');
      if (!btn) return;
      const selector = btn.getAttribute('data-copy');
      const target = document.querySelector(selector);
      if (!target) return;
      navigator.clipboard.writeText(target.innerText.trim());
      const original = btn.innerHTML;
      btn.innerHTML = '<span class="text-emerald-400 font-mono text-[11px]">Copied</span>';
      setTimeout(() => { btn.innerHTML = original; }, 2000);
    });
  </script>

  {!! bir_scripts() !!}
</body>
</html>
